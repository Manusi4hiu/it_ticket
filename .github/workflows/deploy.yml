name: Deploy to aaPanel

on:
  push:
    branches:
      - main # Change this if your main branch is named differently (e.g., master)

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # 1. SETUP & BUILD FRONTEND
      # ---------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Match this with your local node version or 24.14.1 on aaPanel

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          pnpm install
          pnpm run build
          
      # ---------------------------------------------------
      # 2. DEPLOY FILES VIA SCP
      # ---------------------------------------------------
      - name: Copy Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "frontend/build/,frontend/package.json,frontend/pnpm-lock.yaml,backend/"
          target: "/www/wwwroot/staging.ani.co.id/it_ticket"
          strip_components: 0
          
      # ---------------------------------------------------
      # 3. RUN SERVER COMMANDS VIA SSH
      # ---------------------------------------------------
      - name: Restart Services on aaPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # --- Frontend Restart ---
            cd /www/wwwroot/staging.ani.co.id/it_ticket/frontend
            pnpm install --prod --frozen-lockfile
            pm2 restart it_ticket_frontend || pm2 start build/server/index.js --name it_ticket_frontend
            
            # --- Backend Restart ---
            cd /www/wwwroot/staging.ani.co.id/it_ticket/backend
            
            # Activate venv and install dependencies
            if [ -d "venv" ]; then
              source venv/bin/activate
              pip install -r requirements.txt
            fi
            
            # Restart via supervisor or systemctl
            if command -v supervisorctl &> /dev/null; then
              supervisorctl restart it_ticket_backend
            elif systemctl is-active --quiet it_ticket_backend; then
              sudo systemctl restart it_ticket_backend
            else
              echo "Backend service not found. Please configure manually in aaPanel."
            fi
