<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050b14" />
  <title>Offline — IT Aero Support</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #050b14 0%, #0a192f 55%, #020c1b 100%);
      color: #f3f4f6;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 32px 24px;
      border-radius: 20px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(59, 130, 246, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 16px;
      background: rgba(59, 130, 246, 0.14);
      border: 1px solid rgba(59, 130, 246, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
    }
    p {
      margin: 0 0 24px;
      font-size: 0.9375rem;
      line-height: 1.6;
      color: #9ca3af;
    }
    button {
      width: 100%;
      padding: 13px 20px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      cursor: pointer;
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>Koneksi Terputus</h1>
    <p>
      IT Aero Support memerlukan koneksi internet untuk menyinkronkan data tiket terbaru.
      Pastikan Wi-Fi atau data seluler aktif, lalu muat ulang.
    </p>
    <button type="button" onclick="window.location.reload()">Coba Lagi</button>
  </main>
</body>
</html>
